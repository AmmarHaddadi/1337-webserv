name: check compile, format & lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}   # allows manual runs from the UI

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format-22 clang-tidy-22 g++

      - name: Check compile
        run: make

      - name: Check formatting
        run: make format V=1

      - name: Lint
        run: make lint V=1
